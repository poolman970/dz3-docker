services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      - GREETING=${GREETING:-Hello, Docker!}
      - STORAGE=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: '1'
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
